[package]
name = "danqing"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "丹青 —— 跨平台自绘 UI 框架"
license = "MIT OR Apache-2.0"

[dependencies]
winit = "0.30.13"
wgpu = "30"
fontdue = "0.9"
etagere = "0.3"
font-kit = "0.14"
bytemuck = "1"
pollster = "1"
thiserror = "2"
log = "0.4"
arboard = "3"
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
anyhow = "1"
env_logger = "0.11"
chrono = "0.4"

[profile.dev]
# debug 构建默认关闭 wgpu 校验层,避免部分机器 1~3s 启动/关闭延迟
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
# 瘦身体感:薄 LTO + 单代码生成单元,缩小二进制并略提运行时性能;
# 仅剥 DWARF 调试信息,保留符号名以便 minidbg 崩溃诊断
lto = "thin"
codegen-units = 1
strip = "debuginfo"
