[package]
name = "danqing"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "丹青 —— 跨平台自绘 UI 框架"
license = "MIT OR Apache-2.0"

[dependencies]
winit = "0.30.13"
# 与 winit 0.30 共享同一 raw-window-handle 版本 (0.6), 用于取原生窗口句柄 (HWND)。
raw-window-handle = "0.6"
wgpu = "30"
fontdue = "0.9"
etagere = "0.3"
font-kit = "0.14"
bytemuck = "1"
pollster = "1"
thiserror = "2"
log = "0.4"
arboard = "3"
image = { version = "0.25", default-features = false, features = ["png"] }
tray-icon = "0.19"
windows-sys = { version = "0.59", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_Diagnostics_Debug", "Win32_System_Threading", "Win32_Graphics_Gdi"] }

[dev-dependencies]
resvg = "0.44"
anyhow = "1"
env_logger = "0.11"
# examples/common/log.rs 的日志时间戳。
chrono = "0.4"
# showcase 示例：打开本地图片文件对话框。
rfd = "0.15"

[build-dependencies]
winresource = "0.1"

[profile.dev]
# debug 构建默认关闭 wgpu 校验层,避免部分机器 1~3s 启动/关闭延迟
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
# 瘦身体感:fat LTO + 极小优化级 + abort-on-panic,显著缩小二进制
# (12MB → ~5-7MB); 单代码生成单元保模块边界利于 minidbg;
# 仅剥 DWARF 调试信息,保留符号名以便 minidbg 崩溃诊断。
lto = "fat"
codegen-units = 1
opt-level = "z"
panic = "abort"
strip = "debuginfo"
