name: Build Pomodoro

on:
  workflow_dispatch:
  push:
    branches: [dev, master]
    paths:
      - 'src/**'
      - 'examples/pomodoro/**'
      - 'assets/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/build-pomodoro.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: pomodoro-x86_64-windows
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: pomodoro-x86_64-linux
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: pomodoro-aarch64-macos
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: pomodoro-x86_64-macos

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            pkg-config \
            libgtk-3-dev \
            libglib2.0-dev \
            libfontconfig1-dev \
            libfreetype-dev \
            libasound2-dev \
            libx11-dev \
            libxdo-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev

      - name: Build pomodoro (release)
        run: cargo build --release --target ${{ matrix.target }} --example pomodoro

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $staging = "dist\${{ matrix.artifact }}"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\examples\pomodoro.exe" "$staging\pomodoro.exe"
          Copy-Item assets "$staging\assets" -Recurse
          Compress-Archive -Path $staging -DestinationPath "${{ matrix.artifact }}.zip"
          Add-Content -Path $env:GITHUB_ENV -Value "archive=${{ matrix.artifact }}.zip"

      - name: Package (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          STAGING="dist/${{ matrix.artifact }}"
          mkdir -p "$STAGING"
          cp "target/${{ matrix.target }}/release/examples/pomodoro" "$STAGING/"
          cp -r assets "$STAGING/assets"
          tar -czf "${{ matrix.artifact }}.tar.gz" -C dist "${{ matrix.artifact }}"
          echo "archive=${{ matrix.artifact }}.tar.gz" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ env.archive }}
          if-no-files-found: error
